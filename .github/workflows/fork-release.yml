name: Fork Release (Android)

# 触发方式：
# 1. 推送 v* 标签，例如 git tag v2.1.0-noglass.1 && git push fork v2.1.0-noglass.1
# 2. 或在 Actions 页面手动运行，填写 tag。
#
# 签名（可选但强烈建议）：
# 在 fork 仓库 Settings → Secrets and variables → Actions 中添加：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 未配置时会生成临时调试签名，但仍然构建 release APK（已优化、非 debuggable）；
# 不同 Run 的签名可能不同，覆盖安装前请先卸载旧版本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v2.1.0-glass.1)'
        required: true
        type: string
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 准备签名
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            STORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS_VALUE="$KEY_ALIAS"
            KEY_PASSWORD_VALUE="$KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "使用 Release 签名。"
          else
            STORE_FILE="$RUNNER_TEMP/fork-debug.jks"
            keytool -genkeypair -v \
              -keystore "$STORE_FILE" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            STORE_PASSWORD="android"
            KEY_ALIAS_VALUE="androiddebugkey"
            KEY_PASSWORD_VALUE="android"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次用临时调试签名构建 release APK（已优化、非 debuggable）；签名随每次运行变化，覆盖安装前请先卸载旧版本。"
          fi
          {
            echo "SIGNING_STORE_FILE=$STORE_FILE"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS_VALUE"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD_VALUE"
          } >> "$GITHUB_ENV"

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease \
            -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
            --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk dist/
          ls -lh dist

      - name: 解析 Release 标签
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release 标签为空"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: dist/*.apk